name: Build Adlink
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: for file in api/*.js lib/*.js lib/auth-routes/*.js; do node --check "$file"; done
      - run: npm test
      - run: npm run build
